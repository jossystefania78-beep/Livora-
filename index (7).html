function normDB(){let had=db.genreMig;db.customGenres=(Array.isArray(db.customGenres)?db.customGenres:[]).map(cleanG).filter(Boolean);let p={...DP,...(db.prefs&&typeof db.prefs==='object'?db.prefs:{})};if(!THEMES[p.theme])p.theme=DP.theme;if(!FONTS[p.titleFont])p.titleFont=DP.titleFont;if(!FONTS[p.bodyFont])p.bodyFont=DP.bodyFont;if(!SIZES[p.size])p.size='m';if(!DSVG[p.decor])p.decor='none';if(!['original','color','paper','image'].includes(p.bgMode)||(p.bgMode==='image'&&!p.bgImage))p.bgMode='original';p.bgDim=Math.max(0,Math.min(90,+p.bgDim||0));db.prefs=p;

function applyPrefs(){let p=db.prefs,t=THEMES[p.theme]||THEMES.vainilla,s=document.documentElement.style;for(let k in t.v)s.setProperty('--'+k,t.v[k]);s.setProperty('--ft',FONTS[p.titleFont].css);s.setProperty('--fb',FONTS[p.bodyFont].css);s.setProperty('--fsz',SIZES[p.size][1]);
let L=$('#bglayer'),D=$('#bgdim');D.style.opacity=0;
if(p.bgMode==='color')L.style.background=p.bgColor;else if(p.bgMode==='paper')L.style.background=TEX+','+p.bgColor;else if(p.bgMode==='image'){L.style.background='center/cover no-repeat url("'+p.bgImage+'")';D.style.opacity=p.bgDim/100}else L.style.background='radial-gradient(var(--dot) 1px,transparent 1px) 0 0/19px 19px,var(--bg)';

function isKnownG(n,skip=-1){let k=norm(n);return GEN_BASE.some(g=>norm(g)===k)||db.customGenres.some((g,j)=>j!==skip&&norm(g)===k)}
function genrePicker(type,sel){let selN=new Set((sel||[]).map(norm)),sug=SUGG[type]||[],all=[...GEN_BASE,...db.customGenres],seen=new Set();all=all.filter(g=>{let k=norm(g);if(seen.has(k))return false;seen.add(k);return true});(sel||[]).forEach(g=>{let c=cleanG(g),k=norm(c);if(c&&!seen.has(k)){seen.add(k);all.push(c)}});
let sk=new Set(sug.map(norm));all=[...all.filter(g=>sk.has(norm(g))),...all.filter(g=>!sk.has(norm(g)))];
let on=all.filter(g=>selN.has(norm(g)));
return `<div class="gp"><label class="gl">Géneros <span class="gcount small" id="gcount">${on.length} seleccionados</span></label><p class="muted small" style="margin:0 0 8px">Toca para elegir varios. Los sugeridos para ${esc(CATS.find(x=>x[0]===type)[1].toLowerCase())} aparecen primero, pero puedes usar cualquiera.</p><div class="chips" id="chips">${all.map(g=>chipHTML(g,selN.has(norm(g)))).join('')}</div><div class="gadd"><input id="gnew" maxlength="40" placeholder="Escribe un género propio…" autocomplete="off"><button class="btn soft" type="button" data-action="gadd">Agregar</button></div><small class="gmsg" id="gmsg"></small><input type="hidden" name="genres" id="gval" value="${esc(on.join(', '))}"></div>`}

function lookSheet(){let p=db.prefs,sw=(label,sty,sel,attrs)=>`<button class="sw${sel?' sel':''}" ${attrs}><span style="${sty}"></span>${label}</button>`;
let themes=Object.entries(THEMES).map(([id,t])=>`<button class="opt${p.theme===id?' sel':''}" data-action="theme" data-id="${id}"><span class="mini" style="background:${t.v.bg};border-color:${t.v.line}"><i style="background:linear-gradient(135deg,${t.v.h1},${t.v.h2})"></i><b style="background:${t.v.paper};border-color:${t.v.line}"></b><em style="background:${t.v.btn}"></em></span><strong>${t.name}</strong><small>${t.desc}</small></button>`).join('');

let fonts=k=>Object.entries(FONTS).map(([id,f])=>`<button class="opt${p[k]===id?' sel':''}" data-action="font" data-k="${k}" data-id="${id}" style="font-family:${f.css}"><strong style="font-size:1.1rem">${f.name}</strong><small>${f.desc}</small></button>`).join('');

let decs=DECS.map(([id,n])=>`<button class="opt${p.decor===id?' sel':''}" data-action="decor" data-id="${id}">${id==='none'?'<div class="dprev" style="height:30px;color:var(--muted)">—</div>':`<div class="dprev">${DSVG[id]}</div>`}<strong>${n}</strong></button>`).join('');
return `<div id="look"><div class="sheet-head"><h2 style="margin:0">Personalización</h2><button class="close" data-action="close">×</button></div><p class="muted small">Los cambios se aplican y se guardan al instante.</p>
<div class="panel preview"><h3 style="margin:0">Así se verá</h3><p>Entre páginas encuentro pequeños universos. Este es un texto de ejemplo para comprobar la lectura.</p><div class="chips"><span class="chip tag on">Romance</span><span class="chip tag">Fantasía</span><span class="chip tag on">Slice of Life</span></div></div>

<div class="toolbar" style="margin-top:22px"><button class="btn soft" data-action="restoreLook">Restaurar apariencia original</button><button class="btn" data-action="close">Listo</button></div></div>`}

function detail(id){let w=db.works.find(x=>x.id===id);if(!w)return;let cat=CATS.find(x=>x[0]===w.type)[1],skip=['id','type','title','cover','synopsis','genres','fav','reminder','rating','status','hasCover','cover','hours','minutes','added'];
let dur=[+w.hours?w.hours+' h':'',+w.minutes?w.minutes+' min':''].filter(Boolean).join(' '),rows=(dur?`<div class="kv"><small>${w.type==='series'?'Duración por episodio':'Duración'}</small><span>${dur}</span></div>`:'')+Object.entries(w).filter(([k,v])=>v&&!skip.includes(k)).map(([k,v])=>`<div class="kv"><small>${esc(LBL[k]||k)}</small><span>${k==='link'&&/^https?:/i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">Abrir enlace ↗</a>`:esc(v)}</span></div>`).join('');

function home(){let total=db.works.length,reading=db.works.filter(w=>['Leyendo','Viendo'].includes(w.status)).length;return `<div class="top"><div><h1>¡Bienvenida a LIVORA!</h1><p class="sub">Tu rincón de historias y recuerdos.</p></div></div><section class="hero"><h2>Un universo entre páginas</h2><p>Guarda lo que lees, lo que ves y todo aquello que merece quedarse contigo.</p><div class="orn" style="color:#e5c995">✿ ✧ ❀ ✧ ✿</div></section><div class="quick"><button data-view="library">📚<br>Mi biblioteca</button><button data-view="favorites">♡<br>Favoritos</button><button data-view="platforms">◈<br>Plataformas</button><button data-view="profile">🌷<br>Mi perfil</button></div><h2>Tu colección</h2><div class="two"><div class="panel"><small>Obras guardadas</small><h2>${total}</h2></div><div class="panel"><small>En progreso</small><h2>${reading}</h2></div></div>`}
function library(){let cats=CATS.map(([id,label,ico])=>{let arr=db.works.filter(w=>w.type===id);return `<section class="category"><button class="category-head" data-action="category" data-id="${id}"><span class="flower">${ico}</span><strong>${label}</strong><small>${arr.length} ${arr.length===1?'obra':'obras'}</small><span>${opened===id?'⌃':'⌄'}</span></button>${opened===id?`<div class="category-body"><button class="btn" data-action="add" data-type="${id}">＋ Añadir ${label.toLowerCase()}</button>${workGrid(arr,id)}</div>`:''}</section>`}).join('');return `<div class="top"><div><h1>Biblioteca</h1><p class="sub">Cada historia en su propio estante.</p></div></div><input class="search" placeholder="Buscar dentro de la biblioteca…" value="${esc(search)}" data-search>${cats}`}
function workGrid(arr,key='f'){if(!arr.length)return `<div class="empty">Todavía no hay obras en esta categoría.<br>Tu próxima historia puede empezar aquí. 🌷</div>`;let q=search.toLowerCase(),list=arr.filter(w=>!q||w.title.toLowerCase().includes(q)).reverse();if(!list.length)return `<div class="empty">No hay resultados.</div>`;let n=more[key]||PAGE;return `<div class="work-grid">${list.slice(0,n).map(workCard).join('')}</div>${list.length>n?`<button class="btn soft more" data-action="more" data-k="${key}">Mostrar más (${list.length-n} restantes)</button>`:''}`}
function workCard(w){let progress=w.total&&w.current?Math.min(100,Math.round(w.current/w.total*100)):0;return `<article class="work" data-action="detail" data-id="${w.id}"><button class="heart" data-action="fav" data-id="${w.id}">${w.fav?'♥':'♡'}</button><div class="cover" data-action="detail" data-id="${w.id}">${w.hasCover?`<img data-cid="${w.id}" alt="">`:esc(w.title.slice(0,1))}</div><strong>${esc(w.title)}</strong><small>${esc(w.status)}${w.current?` · ${w.current}/${w.total||'?'}`:''}</small>${w.rating?`<div class="stars sm">${starsHTML(w.rating)}</div>`:''}${progress?`<div class="progress"><i style="width:${progress}%"></i></div>`:''}</article>`}

else if(a==='gadd'){let inp=$('#gnew'),r=addCustomG(inp.value),m=$('#gmsg');if(r.s==='empty'){m.textContent='Escribe un nombre para el género.';return}
if(r.s==='exists'){let c=[...document.querySelectorAll('#chips .chip')].find(x=>norm(x.dataset.g)===norm(r.n));if(c){c.classList.add('on');c.setAttribute('aria-pressed','true')}m.textContent='«'+r.n+'» ya existe; quedó seleccionado.'}
else{$('#chips').insertAdjacentHTML('beforeend',chipHTML(r.n,true));m.textContent='«'+r.n+'» guardado para usarlo en otras obras.'}inp.value='';syncG()}
else if(a==='gadd2'){let r=addCustomG($('#gnew2').value);if(r.s==='empty')return;if(r.s==='exists'){alert('«'+r.n+'» ya existe.');return}render()}
else if(a==='gedit'){let i=+b.dataset.id,old=db.customGenres[i],n=prompt('Editar género',old);if(n===null)return;n=cleanG(n);if(!n||n===old)return;if(isKnownG(n,i)){alert('Ya existe un género con ese nombre.');return}
db.customGenres[i]=n;db.works.forEach(w=>{if(Array.isArray(w.genres))w.genres=w.genres.map(g=>norm(g)===norm(old)?n:g)});save();render()}
else if(a==='gdel'){let i=+b.dataset.id;if(confirm('¿Eliminar el género «'+db.customGenres[i]+'»? Las obras que ya lo tienen lo conservarán.')){db.customGenres.splice(i,1);save();render()}}
else if(a==='look'){openModal(lookSheet())}
else if(a==='theme'){p.theme=b.dataset.id;lookChange()}
else if(a==='bg'){p.bgMode=b.dataset.mode;if(b.dataset.color)p.bgColor=b.dataset.color;lookChange()}
else if(a==='bgreset'){p.bgMode='original';lookChange()}
else if(a==='bgdelete'){p.bgImage='';if(p.bgMode==='image')p.bgMode='original';lookChange()}
else if(a==='bgupload'){$('#bg-file').click()}
else if(a==='font'){p[b.dataset.k]=b.dataset.id;lookChange()}
else if(a==='fsize'){p.size=b.dataset.id;lookChange()}
else if(a==='decor'){p.decor=b.dataset.id;lookChange()}
else if(a==='restoreLook'&&confirm('¿Restaurar la apariencia original? Tus obras y tus géneros no se tocan.')){db.prefs={...DP};lookChange()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#gnew,#gnew2')){e.preventDefault();(e.target.id==='gnew'?$('[data-action=gadd]'):$('[data-action=gadd2]')).click()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-dim]')){db.prefs.bgDim=+e.target.value;applyPrefs();let l=e.target.previousElementSibling;if(l)l.textContent='Legibilidad del texto: velo sobre la imagen ('+db.prefs.bgDim+'%)'}});
document.addEventListener('change',async e=>{if(e.target.matches('[data-dim]'))save();if(e.target.id==='bg-file'&&e.target.files[0]){try{let prev={m:db.prefs.bgMode,i:db.prefs.bgImage};db.prefs.bgImage=await readImage(e.target.files[0],1280,.65);db.prefs.bgMode='image';if(!save()){db.prefs.bgImage=prev.i;db.prefs.bgMode=prev.m}applyPrefs();if($('#look'))refreshLook()}catch{alert('No se pudo leer esa imagen.')}e.target.value=''}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action=star]');if(!b)return;let v=+b.dataset.v,r=$('#rating'),n=+r.value===v?0:v;r.value=n;document.querySelectorAll('#stars button').forEach((x,i)=>x.classList.toggle('on',i<n));$('#rtxt').textContent=n?n+' de 5':'Sin calificar'});
let gal=document.createElement('input');gal.type='file';gal.accept='image/*';gal.id='gallery-file';gal.className='hidden';document.body.append(gal);
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script></body></html>
